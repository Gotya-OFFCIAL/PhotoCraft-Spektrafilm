[package]
name = "spektra-core"
description = "Spectral primitives: wavelength grid, spectral distributions, CIE CMFs, color space math"
# Vendored from spektrafilm-rust (Rust port of andreavolpato/spektrafilm); GPL-3.0-or-later.
# Deliberately not workspace-inherited: this crate's license differs from the fork's MIT/Apache.
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
libm = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
